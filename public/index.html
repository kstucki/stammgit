<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Family Tree</title>
  <link rel="stylesheet" href="/assets/app.css?v=32" />
</head>
<body>
  <header class="topbar">
    <!-- Text content of the chrome is filled in from data/config.json and
         strings.js on load; the markup carries neutral placeholders so no
         language shows through before the app has started. -->
    <div class="eyebrow"></div>
    <div class="header-actions">
      <a class="ghost button-link small" href="/.netlify/functions/logout"></a>
    </div>
  </header>

  <nav class="tabs" aria-label="Navigation">
    <button class="tab active" data-view="overview"></button>
    <button class="tab" data-view="chronicle" hidden></button>
    <button class="tab" data-view="sources"></button>
    <button class="tab" data-view="admin"></button>
  </nav>

  <main id="app">
    <section class="loading"></section>
  </main>

  <dialog id="personDialog">
    <button class="dialog-close" data-close-label>×</button>
    <div id="personDialogContent"></div>
  </dialog>

  <dialog id="editDialog">
    <button class="dialog-close" data-close-label>×</button>
    <div id="editDialogContent"></div>
  </dialog>

  <script type="module" src="/assets/app.js?v=32"></script>
</body>
</html>
