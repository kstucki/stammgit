# Instance configuration – the app only READS this file, it never writes it.
# On Netlify every Git push deploys automatically; when hosting locally,
# run `npm run build` (or restart via `npm start`) after editing this file.

language: en                # UI language: de | en
title: "Family Tree"        # browser tab
eyebrow: "Private family archive"
defaultTree: napoleon       # dataset visitors see (data/trees/<name>.yaml); admins switch locally per device

overview:
  heading: "Napoleon Bonaparte"
  intro: >-
    Demo dataset: the Bonaparte family across four generations – eight
    siblings, two marriages of Napoleon I, and the line to Napoleon III.
  note: >-
    The <b>direct line</b> shows ancestors and descendants of the center
    person, the <b>full view</b> shows the whole family. Click a name to
    open the person. Create your own dataset in the admin tab.
  linesHeading: "Starting points"
  # Template: each entry links a label to a person in the default dataset;
  # clicking it jumps into the tree focused on that person.
  extraLines:
    - label: "Napoleon I"
      person: napoleon_i_bonaparte
      text: "Emperor of the French - the focus of this dataset, shown with his parents, eight siblings and both marriages."
    - label: "Napoleon III"
      person: napoleon_iii_bonaparte
      text: "Son of Napoleon's brother Louis and of Josephine's daughter Hortense - the family's double connection, visible as a loop in the full view."
